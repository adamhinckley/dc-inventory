# Deploy the Fastify API to Fly. One app for now (dc-inventory-api).
# Push to main or Actions → Deploy API → Run workflow.
# Secrets: FLY_API_TOKEN (deploy), DATABASE_URL (Neon direct, for migrate).
name: Deploy API

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-api
  cancel-in-progress: false

jobs:
  deploy-api:
    name: deploy-api
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.3
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Migrate Neon
        run: pnpm db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@v1
      - name: Deploy Fly
        run: flyctl deploy --remote-only --ha=false --app dc-inventory-api
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
