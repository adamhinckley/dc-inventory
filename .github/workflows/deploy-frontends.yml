# Deploy Next.js frontends to Vercel (internal + wholesale).
# Push to main (frontend paths) or Actions → Deploy frontends → Run workflow.
#
# One-time Vercel setup (repo root):
#   pnpm dlx vercel login
#   pnpm dlx vercel link --repo
#   Create/link projects with Root Directory apps/internal and apps/wholesale.
#
# GitHub secrets (Settings → Secrets and variables → Actions):
#   VERCEL_TOKEN — vercel.com/account/tokens
#   VERCEL_ORG_ID — .vercel/project.json after link (or team id)
#   VERCEL_PROJECT_ID_INTERNAL — internal dashboard project id
#   VERCEL_PROJECT_ID_WHOLESALE — wholesale shop project id
#
# Vercel env (both projects, Production + Preview):
#   API_PROXY_ORIGIN=https://dc-inventory-api.fly.dev
#   NEXT_PUBLIC_API_URL=   (leave empty — same-origin /internal or /wholesale rewrites)
name: Deploy frontends

on:
  push:
    branches:
      - main
    paths:
      - "apps/internal/**"
      - "apps/wholesale/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/deploy-frontends.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-frontends
  cancel-in-progress: false

jobs:
  deploy-internal:
    name: deploy-internal
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_INTERNAL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.3
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install Vercel CLI
        run: pnpm add -g vercel@59.10.0
      - name: Pull Vercel env
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: apps/internal
      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: apps/internal
      - name: Deploy
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: apps/internal

  deploy-wholesale:
    name: deploy-wholesale
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_WHOLESALE }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.3
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install Vercel CLI
        run: pnpm add -g vercel@59.10.0
      - name: Pull Vercel env
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: apps/wholesale
      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: apps/wholesale
      - name: Deploy
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: apps/wholesale
