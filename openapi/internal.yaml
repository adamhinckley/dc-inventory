                  type: string
                  minLength: 1
                customerNumber:
                  nullable: true
                  type: string
                  minLength: 1
                taxId:
                  nullable: true
                  type: string
                accountStatus:
                  type: string
                  enum:
                    - active
                    - on_hold
                    - inactive
                customerNote:
                  nullable: true
                  type: string
                staffNote:
                  nullable: true
                  type: string
                wholesaleEmail:
                  type: string
                  minLength: 1
                wholesaleDisplayName:
                  type: string
                  minLength: 1
              required:
                - name
                - terms
      responses:
        "201":
