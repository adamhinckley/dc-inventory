openapi: 3.0.3
info:
  title: DC Inventory internal API
  version: 0.0.0
components:
  schemas: {}
paths:
  /internal/auth/login:
    post:
      operationId: loginInternal
      summary: Staff login; sets HttpOnly staff_session
      tags:
        - internal-auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                organizationSlug:
                  type: string
                  minLength: 1
                email:
                  type: string
                  minLength: 1
                password:
                  type: string
                  minLength: 1
              required:
                - organizationSlug
                - email
                - password
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  staffUserId:
                    type: string
                    format: uuid
                    pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                  email:
                    type: string
                  organizationId:
                    type: string
                  roles:
                    type: array
                    items:
                      type: string
                      enum:
                        - admin
                        - purchasing
                        - warehouse
                        - sales_support
                required:
                  - staffUserId
                  - email
                  - organizationId
                  - roles
                additionalProperties: false
        "401":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    enum:
                      - unauthorized
                required:
                  - error
                additionalProperties: false
        "429":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    enum:
                      - too_many_login_attempts
                  retryAfterSeconds:
                    type: integer
                    minimum: 0
                    exclusiveMinimum: true
                    maximum: 9007199254740991
                required:
                  - error
                  - retryAfterSeconds
                additionalProperties: false
  /internal/auth/logout:
