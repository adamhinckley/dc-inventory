                        name:
                          type: string
                        customerNumber:
                          type: string
                        creditLimitCents:
                          type: integer
                          minimum: -9007199254740991
                          maximum: 9007199254740991
                        currency:
                          type: string
                        terms:
                          type: string
                        taxId:
                          nullable: true
                          type: string
                        accountStatus:
                          type: string
                          enum:
                            - active
                            - on_hold
                            - inactive
                        customerNote:
                          nullable: true
                          type: string
                        staffNote:
                          nullable: true
                          type: string
                        createdAt:
                          type: string
                          format: date-time
                          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
                      required:
                        - id
                        - name
                        - customerNumber
                        - creditLimitCents
                        - currency
                        - terms
                        - taxId
                        - accountStatus
                        - customerNote
                        - staffNote
                        - createdAt
                      additionalProperties: false
                  page:
                    type: integer
                    minimum: -9007199254740991
                    maximum: 9007199254740991
                  pageSize:
                    type: integer
                    minimum: -9007199254740991
                    maximum: 9007199254740991
                  total:
                    type: integer
                    minimum: -9007199254740991
                    maximum: 9007199254740991
                required:
                  - items
                  - page
                  - pageSize
                  - total
                additionalProperties: false
        "400":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    enum:
                      - invalid_request
                  message:
                    type: string
                    enum:
                      - The request is invalid.
                  requestId:
                    type: string
                required:
                  - error
                  - message
                  - requestId
                additionalProperties: false
        "401":
          description: Default Response
