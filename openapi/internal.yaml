    post:
      operationId: reopenInternalInventorySkus
      summary: Reopen filtered SKUs for the next pre-sell with an optional shared sell
        window
      tags:
        - internal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                filterSnapshot:
                  default: {}
                  type: object
                  properties:
                    q:
                      type: string
                    category:
                      type: array
                      items:
                        type: string
                    supplierId:
                      type: array
                      items:
                        type: string
                        format: uuid
                        pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                    excludeSupplierId:
                      type: array
                      items:
                        type: string
                        format: uuid
                        pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                skus:
                  minItems: 1
                  type: array
                  items:
                    type: string
                    minLength: 1
                windowOpensAt:
                  nullable: true
                  type: string
                  format: date-time
                  pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
                windowClosesAt:
                  type: string
                  format: date-time
                  pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
              required:
                - name
                - skus
                - windowClosesAt
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  reopenedCount:
                    type: integer
                    minimum: 0
                    maximum: 9007199254740991
                  sellWindowId:
                    type: string
                    format: uuid
                    pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                  skuCount:
                    type: integer
                    minimum: 0
                    maximum: 9007199254740991
                required:
                  - reopenedCount
                  - sellWindowId
                  - skuCount
                additionalProperties: false
        "400":
          description: Default Response
          content:
            application/json:
              schema:
                anyOf:
                  - type: object
                    properties:
                      error:
                        type: string
                        enum:
                          - invalid
                    required:
                      - error
                    additionalProperties: false
                  - type: object
                    properties:
                      error:
                        type: string
                        enum:
                          - invalid_sell_window
                    required:
                      - error
                    additionalProperties: false
        "401":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    enum:
                      - unauthorized
                required:
                  - error
                additionalProperties: false
        "403":
          description: Default Response
          content:
            application/json:
              schema:
                anyOf:
                  - anyOf:
                      - type: object
                        properties:
                          error:
                            type: string
                            enum:
                              - forbidden
                        required:
                          - error
                        additionalProperties: false
                      - type: object
                        properties:
                          error:
                            type: string
                            enum:
                              - feature_disabled
                        required:
                          - error
                        additionalProperties: false
                  - type: object
                    properties:
                      error:
                        type: string
                        enum:
                          - feature_disabled
                    required:
                      - error
                    additionalProperties: false
