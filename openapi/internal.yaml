        rowId: id
        columns:
          - field: name
            label: Name
          - field: customerNumber
            label: "Customer #"
          - field: accountStatus
            label: Status
          - field: terms
            label: Terms
        search:
          param: q
          fields:
            - name
            - customerNumber
          placeholder: "Search name or customer #"
        filters:
          - param: accountStatus
            control: select
        sort:
          defaultBy: name
          defaultOrder: asc
          fields:
            - name
            - createdAt
            - creditLimitCents
            - customerNumber
