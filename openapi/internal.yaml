openapi: 3.0.3
info:
  title: DC Inventory internal API
  version: 0.0.0
components:
  schemas: {}
paths:
  /internal/auth/login:
    post:
      operationId: loginInternal
      summary: Staff login; sets HttpOnly staff_session
      tags:
        - internal-auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                organizationSlug:
                  type: string
                  minLength: 1
                email:
                  type: string
                  minLength: 1
                password:
                  type: string
                  minLength: 1
              required:
                - organizationSlug
                - email
                - password
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  staffUserId:
                    type: string
                    format: uuid
                    pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                  email:
                    type: string
                  organizationId:
                    type: string
                  roles:
                    type: array
                    items:
                      type: string
                      enum:
                        - admin
                        - purchasing
                        - warehouse
                        - sales_support
                        - accounting
                required:
                  - staffUserId
                  - email
                  - organizationId
                  - roles
                additionalProperties: false
        "401":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    enum:
                      - unauthorized
                required:
                  - error
                additionalProperties: false
        "429":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    enum:
                      - too_many_login_attempts
                  retryAfterSeconds:
                    type: integer
                    minimum: 0
                    exclusiveMinimum: true
                    maximum: 9007199254740991
                required:
                  - error
                  - retryAfterSeconds
                additionalProperties: false
  /internal/auth/logout:
    post:
      operationId: logoutInternal
      summary: Revoke staff session and clear cookie
      tags:
        - internal-auth
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    enum:
                      - true
                required:
                  - ok
                additionalProperties: false
        "401":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    enum:
                      - unauthorized
                required:
                  - error
                additionalProperties: false
  /internal/auth/set-password:
    post:
      operationId: setPasswordInternal
      summary: Set staff password from invite token
      tags:
        - internal-auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                  minLength: 1
                password:
                  type: string
                  minLength: 1
              required:
                - token
                - password
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    enum:
                      - true
                required:
                  - ok
                additionalProperties: false
        "400":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    enum:
                      - invalid
                  violation:
                    type: string
                    enum:
                      - too_short
                      - missing_uppercase
                      - missing_lowercase
                      - missing_number
                required:
                  - error
                additionalProperties: false
  /internal/auth/session:
    get:
      operationId: getInternalSession
      summary: Current staff session
      tags:
        - internal-auth
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  staffUserId:
                    type: string
                    format: uuid
                    pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                  email:
                    type: string
                  organizationId:
                    type: string
                  roles:
                    type: array
                    items:
                      type: string
                      enum:
                        - admin
                        - purchasing
                        - warehouse
                        - sales_support
                        - accounting
                required:
                  - staffUserId
                  - email
                  - organizationId
                  - roles
                additionalProperties: false
        "401":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    enum:
                      - unauthorized
                required:
                  - error
                additionalProperties: false
  /internal/organizations:
    post:
      operationId: createInternalOrganization
      summary: Provision a new organization and invite its first admin (DEFAULT
        platform only)
      tags:
        - internal-organizations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                slug:
                  type: string
                  minLength: 1
                staffDisplayName:
                  type: string
                  minLength: 1
                staffEmail:
                  type: string
                  minLength: 1
              required:
                - name
                - slug
                - staffDisplayName
                - staffEmail
      responses:
        "201":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  organizationId:
                    type: string
                  staffUserId:
                    type: string
                    format: uuid
                    pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                  slug:
                    type: string
                  inviteSentTo:
                    type: string
                required:
                  - organizationId
                  - staffUserId
                  - slug
                  - inviteSentTo
                additionalProperties: false
        "400":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    enum:
                      - invalid
                required:
                  - error
                additionalProperties: false
        "401":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    enum:
                      - unauthorized
                required:
                  - error
                additionalProperties: false
        "403":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    enum:
                      - forbidden
                required:
                  - error
                additionalProperties: false
        "409":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    enum:
                      - slug_taken
                required:
                  - error
                additionalProperties: false
        "502":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    enum:
                      - invite_failed
                required:
                  - error
                additionalProperties: false
        "503":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    enum:
                      - licensing_twin_failed
                required:
                  - error
                additionalProperties: false
  /internal/staff:
    post:
      operationId: createInternalStaff
      summary: Create staff user and send invite
      tags:
        - internal-staff
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                displayName:
                  type: string
                  minLength: 1
                email:
                  type: string
                  minLength: 1
                roles:
                  minItems: 1
                  type: array
                  items:
                    type: string
                    enum:
                      - admin
                      - purchasing
                      - warehouse
                      - sales_support
                      - accounting
              required:
                - displayName
                - email
                - roles
      responses:
        "201":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                    pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                  displayName:
                    type: string
                  email:
                    type: string
                  roles:
                    type: array
                    items:
                      type: string
                      enum:
                        - admin
                        - purchasing
                        - warehouse
                        - sales_support
                        - accounting
                required:
                  - id
                  - displayName
                  - email
                  - roles
                additionalProperties: false
        "400":
          description: Default Response
          content:
            application/json:
              schema:
                anyOf:
                  - type: object
                    properties:
                      error:
                        type: string
                        enum:
                          - invalid
                    required:
                      - error
                    additionalProperties: false
                  - type: object
                    properties:
                      error:
                        type: string
                        enum:
                          - invalid_request
                      message:
                        type: string
                        enum:
                          - The request is invalid.
                      requestId:
                        type: string
                    required:
                      - error
                      - message
                      - requestId
                    additionalProperties: false
        "401":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    enum:
                      - unauthorized
                required:
                  - error
                additionalProperties: false
        "403":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    enum:
                      - forbidden
                required:
                  - error
                additionalProperties: false
        "409":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    enum:
                      - duplicate_email
                required:
                  - error
                additionalProperties: false
  /internal/customers:
    get:
      operationId: listInternalCustomers
      summary: List customers
      tags:
        - internal-customers
      parameters:
        - schema:
            type: string
          in: query
          name: q
          required: false
        - schema:
            type: string
            enum:
              - active
              - on_hold
              - inactive
          in: query
          name: accountStatus
          required: false
        - schema:
            default: 1
            type: integer
            minimum: 1
            maximum: 9007199254740991
          in: query
          name: page
          required: false
        - schema:
            default: 25
            type: integer
            minimum: 1
            maximum: 100
          in: query
          name: pageSize
          required: false
        - schema:
            default: name
            type: string
            enum:
              - name
              - createdAt
              - creditLimitCents
              - customerNumber
          in: query
          name: sortBy
          required: false
        - schema:
            default: asc
            type: string
            enum:
              - asc
              - desc
          in: query
          name: sortOrder
          required: false
      x-table:
        rowId: id
        columns:
          - field: name
            label: Name
          - field: customerNumber
            label: "Customer #"
          - field: accountStatus
            label: Status
          - field: terms
            label: Terms
        search:
          param: q
          fields:
            - name
            - customerNumber
          placeholder: "Search name or customer #"
        filters:
          - param: accountStatus
            control: select
        sort:
          defaultBy: name
          defaultOrder: asc
          fields:
            - name
            - createdAt
            - creditLimitCents
            - customerNumber
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                        name:
                          type: string
                        customerNumber:
                          type: string
                        creditLimitCents:
                          type: integer
                          minimum: -9007199254740991
                          maximum: 9007199254740991
                        currency:
                          type: string
                        terms:
                          type: string
                        taxId:
                          nullable: true
                          type: string
                        accountStatus:
                          type: string
                          enum:
                            - active
                            - on_hold
                            - inactive
                        customerNote:
                          nullable: true
                          type: string
                        staffNote:
                          nullable: true
                          type: string
                        createdAt:
                          type: string
                          format: date-time
                          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
                      required:
                        - id
                        - name
                        - customerNumber
                        - creditLimitCents
                        - currency
                        - terms
                        - taxId
                        - accountStatus
                        - customerNote
                        - staffNote
                        - createdAt
                      additionalProperties: false
                  page:
                    type: integer
                    minimum: -9007199254740991
                    maximum: 9007199254740991
                  pageSize:
                    type: integer
                    minimum: -9007199254740991
                    maximum: 9007199254740991
                  total:
                    type: integer
                    minimum: -9007199254740991
                    maximum: 9007199254740991
                required:
                  - items
                  - page
                  - pageSize
                  - total
                additionalProperties: false
        "400":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    enum:
                      - invalid_request
                  message:
                    type: string
                    enum:
                      - The request is invalid.
                  requestId:
                    type: string
                required:
                  - error
                  - message
                  - requestId
                additionalProperties: false
        "401":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    enum:
                      - unauthorized
                required:
                  - error
                additionalProperties: false
        "403":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    enum:
                      - feature_disabled
                required:
                  - error
                additionalProperties: false
    post:
      operationId: createInternalCustomer
      summary: Create customer
      tags:
        - internal-customers
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
