  /wholesale/catalog:
    get:
      operationId: listWholesaleCatalog
      summary: List shop-visible catalog products
      tags:
        - wholesale
      parameters:
        - schema:
            type: string
          in: query
          name: q
          required: false
        - schema:
            type: string
            minLength: 1
          in: query
          name: category
          required: false
        - schema:
            default: 1
            type: integer
            minimum: 1
            maximum: 9007199254740991
          in: query
          name: page
          required: false
        - schema:
            default: 25
            type: integer
            minimum: 1
            maximum: 100
          in: query
          name: pageSize
          required: false
        - schema:
            default: name
            type: string
            enum:
              - name
              - available
          in: query
          name: sortBy
          required: false
        - schema:
            default: asc
            type: string
            enum:
              - asc
              - desc
          in: query
          name: sortOrder
          required: false
        - schema:
            default: true
            anyOf:
              - type: string
                enum:
                  - "true"
              - type: string
                enum:
                  - "false"
              - type: boolean
          in: query
          name: availableOnly
          required: false
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                        sku:
                          type: string
                        name:
                          type: string
                        description:
                          nullable: true
                          type: string
                        imageUrl:
                          nullable: true
                          type: string
                        wholesalePrice:
                          type: integer
                          minimum: -9007199254740991
                          maximum: 9007199254740991
                        currency:
                          type: string
                        available:
                          type: integer
                          minimum: -9007199254740991
                          maximum: 9007199254740991
                        committed:
                          type: integer
                          minimum: -9007199254740991
                          maximum: 9007199254740991
                        sellState:
                          type: string
                          enum:
                            - open
                            - locked
                        availableToSell:
                          nullable: true
                          type: integer
                          minimum: -9007199254740991
                          maximum: 9007199254740991
                      required:
                        - id
                        - sku
                        - name
                        - description
                        - imageUrl
                        - wholesalePrice
                        - currency
                        - available
                        - committed
                        - sellState
                        - availableToSell
                      additionalProperties: false
                  page:
                    type: integer
                    minimum: -9007199254740991
                    maximum: 9007199254740991
                  pageSize:
                    type: integer
                    minimum: -9007199254740991
                    maximum: 9007199254740991
                  total:
                    type: integer
                    minimum: -9007199254740991
                    maximum: 9007199254740991
                required:
                  - items
                  - page
                  - pageSize
                  - total
                additionalProperties: false
        "401":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    enum:
                      - unauthorized
                required:
                  - error
                additionalProperties: false
        "403":
          description: Default Response
          content:
            application/json:
              schema:
                anyOf:
                  - anyOf:
                      - type: object
                        properties:
                          error:
                            type: string
                            enum:
                              - needs_customer
                        required:
                          - error
                        additionalProperties: false
                      - type: object
                        properties:
                          error:
                            type: string
                            enum:
                              - feature_disabled
                        required:
                          - error
                        additionalProperties: false
                  - type: object
                    properties:
                      error:
                        type: string
                        enum:
                          - feature_disabled
                    required:
                      - error
                    additionalProperties: false
