                additionalProperties: false
        "404":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    enum:
                      - not_found
                required:
                  - error
                additionalProperties: false
        "409":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    enum:
                      - conflict
                required:
                  - error
                additionalProperties: false
  /wholesale/auth/clear-customer:
    post:
      operationId: clearActingCustomer
      summary: Clear the customer binding from a staff-acting wholesale session
      tags:
