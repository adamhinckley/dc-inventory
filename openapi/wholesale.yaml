                    maximum: 9007199254740991
                  currency:
                    type: string
                  available:
                    type: integer
                    minimum: -9007199254740991
                    maximum: 9007199254740991
                  committed:
                    type: integer
                    minimum: -9007199254740991
                    maximum: 9007199254740991
                  sellState:
                    type: string
                    enum:
                      - open
                      - locked
                  availableToSell:
                    nullable: true
                    type: integer
                    minimum: -9007199254740991
                    maximum: 9007199254740991
                required:
                  - id
                  - sku
                  - name
                  - description
                  - imageUrl
                  - wholesalePrice
                  - currency
                  - available
                  - committed
                  - sellState
                  - availableToSell
                additionalProperties: false
        "401":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    enum:
                      - unauthorized
                required:
                  - error
                additionalProperties: false
        "403":
          description: Default Response
          content:
            application/json:
              schema:
                anyOf:
                  - anyOf:
                      - type: object
                        properties:
                          error:
                            type: string
                            enum:
                              - needs_customer
                        required:
                          - error
                        additionalProperties: false
                      - type: object
                        properties:
                          error:
                            type: string
                            enum:
                              - feature_disabled
                        required:
                          - error
                        additionalProperties: false
                  - type: object
                    properties:
                      error:
                        type: string
                        enum:
                          - feature_disabled
                    required:
                      - error
                    additionalProperties: false
        "404":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    enum:
                      - not_found
                required:
                  - error
                additionalProperties: false
  /wholesale/account/detail:
    get:
      operationId: getWholesaleAccountDetail
      summary: Read bundled account detail for session customer
      tags:
        - wholesale
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  account:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                        pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                      name:
                        type: string
                      customerNumber:
                        type: string
                      creditLimitCents:
                        type: integer
                        minimum: -9007199254740991
                        maximum: 9007199254740991
                      currency:
                        type: string
                      terms:
                        type: string
                      taxId:
                        nullable: true
                        type: string
                      accountStatus:
                        type: string
                        enum:
                          - active
                          - on_hold
                          - inactive
                      customerNote:
                        nullable: true
                        type: string
                      createdAt:
                        type: string
                        format: date-time
                        pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
                    required:
                      - id
                      - name
                      - customerNumber
                      - creditLimitCents
                      - currency
                      - terms
                      - taxId
                      - accountStatus
                      - customerNote
                      - createdAt
                    additionalProperties: false
                  shipTos:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                        customerId:
                          type: string
                          format: uuid
                          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                        line1:
                          type: string
                        line2:
                          nullable: true
                          type: string
                        city:
                          type: string
                        region:
                          type: string
                        postal:
                          type: string
                        country:
                          type: string
                        isDefault:
                          type: boolean
                      required:
                        - id
                        - customerId
                        - line1
                        - line2
                        - city
                        - region
                        - postal
                        - country
                        - isDefault
                      additionalProperties: false
                  billTo:
                    nullable: true
                    type: object
                    properties:
                      customerId:
