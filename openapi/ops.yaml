openapi: 3.0.3
info:
  title: DC Inventory ops API
  version: 0.0.0
components:
  schemas: {}
paths:
  /ops/auth/login:
    post:
      operationId: loginOps
      summary: Ops login (throttled; credential verification not yet implemented)
      tags:
        - ops-auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                organizationSlug:
                  type: string
                  minLength: 1
                email:
                  type: string
                  minLength: 1
                password:
                  type: string
                  minLength: 1
              required:
                - organizationSlug
                - email
                - password
      responses:
        "401":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    enum:
                      - unauthorized
                required:
                  - error
                additionalProperties: false
        "429":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    enum:
                      - too_many_login_attempts
                  retryAfterSeconds:
                    type: integer
                    minimum: 0
                    exclusiveMinimum: true
                    maximum: 9007199254740991
                required:
                  - error
                  - retryAfterSeconds
                additionalProperties: false
  /ops/subscription:
    get:
      operationId: getOpsSubscription
      summary: Stub software subscription
      tags:
        - ops
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - trialing
                      - active
                      - inactive
                  plan:
                    nullable: true
                    type: string
                required:
                  - status
                  - plan
                additionalProperties: false
servers:
  - url: http://localhost:3001
