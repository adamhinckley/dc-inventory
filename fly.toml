# Fastify composition root. Postgres is Neon, not Fly.
# Cheap start: machine stops when idle and wakes on the next request.
app = "dc-inventory-api"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "8080"
  TRUST_PROXY = "1"
  CORS_ORIGINS = "http://localhost:3000,http://localhost:3002"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[http_service.checks]]
  interval = "15s"
  timeout = "5s"
  grace_period = "90s"
  method = "GET"
  path = "/ready"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
